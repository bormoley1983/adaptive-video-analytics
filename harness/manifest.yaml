# AVA RTSP replay harness manifest (E-3-T2 / B-019; extended for E-3-T5).
#
# Deterministic camera-to-source mapping. cam-01..cam-04 are the original
# four distinct clips; cam-05..cam-50 reuse those same four sources in a
# round-robin so capacity points (16/25/50) can be measured without new
# footage. Each publisher re-encodes its source clip to a uniform H.264 720p
# @ 10 FPS stream for consistent capacity measurement (ADR-2).

version: 1
target:
  codec: h264
  resolution: 1280x720
  fps: 10
  gop: 30          # keyframe every 30 frames (~3 s at 10 FPS)
  bitrate: 2M

cameras:
  - id: cam-01
    source: crosswalk-day-pedestrians.mp4
    rtsp_path: /cam-01
    description: Daytime crosswalk, people/vehicle baseline (capacity stream)
  - id: cam-02
    source: intersection-signal-day-vehicles.mp4
    rtsp_path: /cam-02
    description: Signalized intersection, daytime vehicles (capacity stream)
  - id: cam-03
    source: intersection-night.mp4
    rtsp_path: /cam-03
    description: Wide urban intersection at night (capacity stream)
  - id: cam-04
    source: highway-fog-low-visibility.mp4
    rtsp_path: /cam-04
    description: Multi-lane highway in dense fog (capacity stream)
