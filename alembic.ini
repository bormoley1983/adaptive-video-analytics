# Alembic configuration for AVA PostgreSQL migrations (B-023).
# The DSN is read from the AVA_PG_DSN environment variable at runtime.

[alembic]
script_location = alembic
prepend_sys_path = .
# DSN is injected by env.py from the AVA_PG_DSN environment variable.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
