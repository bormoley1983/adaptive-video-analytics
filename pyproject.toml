[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ava"
version = "0.1.0"
description = "Adaptive Video Analytics: single-camera detection PoC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - internal PoC" }
authors = [{ name = "AVA" }]

# Conventional + prompted detection dependencies.
# Versions are pinned after the compatibility run (ADR-1 current-stable policy).
dependencies = [
    # Core inference. Revalidate exact mutually-compatible stable set at build time.
    "ultralytics>=8.4.0",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "opencv-python-headless>=4.9",
    # YOLOE text-prompting tokenizer dependency (ADR-3).
    "clip @ git+https://github.com/ultralytics/CLIP.git@main",
    # Configuration and validation.
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.4",
]

[project.scripts]
ava = "ava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "integration: verifies collaboration between AVA components without a live deployment",
    "e2e: verifies a complete user-visible workflow with production-like boundaries",
    "infra: verifies container, GPU, service, or deployment infrastructure",
]

[tool.coverage.run]
branch = true
source = ["ava"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
