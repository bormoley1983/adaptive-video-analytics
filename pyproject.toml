[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ava"
version = "0.1.0"
description = "Adaptive Video Analytics: single-camera detection PoC (E-1)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - internal PoC" }
authors = [{ name = "AVA" }]

# E-1 conventional + prompted detection slice.
# Versions are pinned after the compatibility run (ADR-1 current-stable policy).
dependencies = [
    # Core inference. Revalidate exact mutually-compatible stable set at build time.
    "ultralytics>=8.4.0",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "opencv-python-headless>=4.9",
    # YOLOE text-prompting tokenizer dependency (ADR-3 / E-1 prerequisites).
    "clip @ git+https://github.com/ultralytics/CLIP.git@main",
    # Configuration and validation.
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ava = "ava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
