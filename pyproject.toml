[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ava"
version = "0.1.0"
description = "Adaptive Video Analytics: single-camera detection PoC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary - internal PoC" }
authors = [{ name = "AVA" }]

# Conventional + prompted detection dependencies.
# Pinned to the exact measured stack from the tested ava/e1:local image (B-016).
# The full transitive closure is captured in requirements.lock.txt; a clean
# rebuild installs from that lock so the tested versions are reproduced exactly.
dependencies = [
    # Core inference (measured on ai-host1, torch cu130 wheels).
    "ultralytics==8.4.183",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "opencv-python-headless==5.0.0.93",
    # YOLOE text-prompting tokenizer dependency (ADR-3), pinned to the exact
    # commit that was tested rather than a moving @main ref.
    "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
    # Configuration and validation.
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    # Prometheus scrape surface for live runs (B-021); stdlib http.server host.
    "prometheus_client==0.26.0",
    # PostgreSQL persistence (B-023): driver, pool, and migrations.
    "psycopg[binary]>=3.1,<4",
    "psycopg_pool>=3.1,<4",
    "alembic>=1.13,<2",
    # API service (F-1): web framework, HTTP client for JWKS, token verification.
    "fastapi>=0.115",
    "httpx>=0.27",
    "authlib==1.6.12",
    "PyJWT>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.0",
    "api-schema-diff>=1.0",
    "PyYAML>=6.0",
]

[project.scripts]
ava = "ava.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ava.api" = ["openapi.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "integration: verifies collaboration between AVA components without a live deployment",
    "e2e: verifies a complete user-visible workflow with production-like boundaries",
    "infra: verifies container, GPU, service, or deployment infrastructure",
]

[tool.coverage.run]
branch = true
source = ["ava"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
