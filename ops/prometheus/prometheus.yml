# Prometheus configuration for the AVA local observability platform (B-022).
#
# The AVA live analytics worker runs on the host (GPU container or host
# process) and exposes a bounded /metrics endpoint when
# live.telemetry.prometheus_port is set. It is reached through
# host.docker.internal (mapped to host-gateway in compose).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # AVA live-run target. The port is the canonical AVA metrics port, kept in
  # sync with live.telemetry.prometheus_port (default 9464) in the run config.
  # If you change that value, update it here too.
  - job_name: ava
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: ava

  # Loki self-metrics (B-024-S1). Service-to-service traffic on the project
  # network; no host port exposure change.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  # PostgreSQL exporter (B-024-S1). The postgres-exporter service in docker-compose.yml
  # exposes metrics on port 9187 inside the project network.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
