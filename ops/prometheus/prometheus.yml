# Prometheus configuration for the AVA local observability platform (B-022).
#
# The AVA live analytics worker runs on the host (GPU container or host
# process) and exposes a bounded /metrics endpoint when
# live.telemetry.prometheus_port is set. It is reached through
# host.docker.internal (mapped to host-gateway in compose).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # AVA live-run target. The port comes from the analytics run config
  # (live.telemetry.prometheus_port); override with AVA_METRICS_PORT in
  # ops/.env when it differs from the default.
  - job_name: ava
    static_configs:
      - targets: ["host.docker.internal:${AVA_METRICS_PORT:-9464}"]
        labels:
          service: ava
