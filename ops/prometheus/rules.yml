# Prometheus alert rules for the AVA local observability platform (B-024-S1).
#
# Thresholds are provisional pending B-003/B-009 owner inputs; final values
# are tracked by the B-024 parent task.

groups:
  - name: ava-service-health
    rules:
      - alert: AvaServiceDown
        expr: up{job="ava"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AVA live worker /metrics endpoint unreachable"
          description: "up{job=\"ava\"} has been 0 for 2 minutes. The AVA live analytics worker is not reachable at its Prometheus scrape target."

  - name: ops-platform-health
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus config reload failed"
          description: "The last Prometheus configuration reload was not successful. Check the active config and recent changes."

      - alert: PrometheusTSDBCompactionsFailing
        expr: rate(prometheus_tsdb_compactions_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus TSDB compaction failures"
          description: "TSDB compactions have been failing over the last 10 minutes. Check disk space and Prometheus logs."

      - alert: LokiRequestErrorsHigh
        expr: >
          sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m]))
          /
          sum(rate(loki_request_duration_seconds_count[5m]))
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Loki 5xx error rate above 5%"
          description: "More than 5% of Loki HTTP requests have returned 5xx over the last 5 minutes."

  - name: database-health
    rules:
      - alert: PostgresUnavailable
        expr: (up{job="postgres"} == 0) or (pg_up{job="postgres"} == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL or its metrics exporter unavailable"
          description: "The PostgreSQL metrics exporter has been unreachable or unable to connect to the ops database for 2 minutes."

  - name: ops-volume-and-backup
    rules:
      # Named volumes share their host backing filesystem; monitor host space.
      - alert: AvaOpsVolumeFillHigh
        expr: |
          (1 - node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"}) > 0.85
          and
          (1 - node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"}) <= 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem usage above 85%"
          description: "A host filesystem is more than 85% full. Check retention and disk capacity for the ops state volumes."

      - alert: AvaOpsVolumeFillHigh
        expr: |
          (1 - node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"}) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host filesystem usage above 95%"
          description: "A host filesystem is more than 95% full. Reclaim space or expand capacity before writes fail."

      - alert: AvaBackupStale
        expr: |
          (time() - node_textfile_mtime_seconds{job="node",file=~".*last-backup-epoch\\.prom"} > 86400)
          or
          (up{job="node"} == 1
            unless on(job, instance)
            node_textfile_mtime_seconds{job="node",file=~".*last-backup-epoch\\.prom"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Successful backup marker missing or older than 24 hours"
          description: "No readable success marker exists, or the last successful PostgreSQL backup is older than 24 hours. Check the backup schedule, directory and logs."

  - name: ops-service-health
    rules:
      - alert: AvaOpsServiceDown
        expr: up{job=~"grafana|alloy"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Grafana or Alloy unreachable"
          description: "The Grafana or Alloy service has been unreachable for 5 minutes. These are required for dashboards and log forwarding."
