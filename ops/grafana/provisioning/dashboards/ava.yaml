# Dashboard provider: load the provisioned AVA dashboard from disk (B-022).
apiVersion: 1

providers:
  - name: ava
    folder: AVA
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
