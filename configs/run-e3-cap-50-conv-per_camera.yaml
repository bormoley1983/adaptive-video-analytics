  profiles:
    - id: crosswalk
      description: Pedestrian line crossing at the crosswalk
      rules:
        - id: ped-crossing
          type: line_crossing
          line:
            start: [0.0, 0.5]
            end: [1.0, 0.5]
          direction: both
          classes:
            include: [person]
          deadband: 0.02
          debounce_frames: 3

    - id: intersection
      description: Vehicle presence in the intersection zone
      rules:
        - id: vehicle-zone
          type: zone_entry
          zone:
            points: [[0.2, 0.3], [0.8, 0.3], [0.8, 0.7], [0.2, 0.7]]
          classes:
            include: [car, motorcycle]
          debounce_frames: 2

    - id: highway
      description: Vehicle dwell on the highway (low-visibility conditions)
      rules:
        - id: vehicle-dwell
          type: dwell
          zone:
            points: [[0.1, 0.4], [0.9, 0.4], [0.9, 0.8], [0.1, 0.8]]
          classes:
            include: [car]
          dwell_seconds: 5.0
          missing_track_grace_s: 2.0
