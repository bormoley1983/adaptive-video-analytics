# E-3-T5 capacity sweep: 50 streams, conventional profile, per_camera detector mode.
#
# Prerequisites:
#   ./harness/normalize.sh
#   docker compose -f harness/docker-compose.yml up -d
#   docker compose -f ops/docker-compose.yml up -d   # dashboard + overhead capture
#
# Run (>= 30 min steady-state after warm-up):
#   ava live --config configs/run-e3-cap-50-conv-per_camera.yaml --gpu 0

detector:
  kind: conventional
  model: models/yolo26n.pt
  confidence: 0.35
  iou: 0.5
gpu: "0"
output_dir: results/e3-cap-50-conv-per_camera

live:
  backend: opencv
  detector_mode: per_camera
  buffer_size: 40
  reconnect_max: 3
  reconnect_delay_s: 1.0
  duration_s: 2100

  telemetry:
    prometheus_port: 9464
    prometheus_host: "0.0.0.0"

  cameras:
